<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newtonix: A Guerra das Leis Perdidas</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
overflow:hidden;
background:#000;
}

canvas{
display:block;
background:linear-gradient(#4ea5ff,#8fd3ff);
}

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:20px;
font-weight:bold;
text-shadow:2px 2px 4px #000;
}

#quiz{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
border-radius:10px;
display:none;
width:350px;
}

#quiz button{
width:100%;
padding:10px;
margin-top:8px;
cursor:pointer;
}

#npcBox{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.8);
color:white;
padding:15px;
border-radius:10px;
display:none;
max-width:500px;
}

#mobile{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:20px;
pointer-events:none;
}

.btn{
width:70px;
height:70px;
border-radius:50%;
background:rgba(255,255,255,.4);
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
color:white;
pointer-events:auto;
user-select:none;
}
</style>
</head>
<body>

<div id="hud">
Vida: <span id="vida">100</span>
&nbsp;&nbsp;
Moedas: <span id="coins">0</span>
</div>

<div id="npcBox"></div>

<div id="quiz">
<h2>Quiz de Física</h2>
<p>Qual é a Primeira Lei de Newton?</p>

<button onclick="answer(1)">
Lei da Inércia
</button>

<button onclick="answer(0)">
F = m.a
</button>

<button onclick="answer(0)">
Ação e reação
</button>

<button onclick="answer(0)">
Energia potencial
</button>
</div>

<canvas id="game"></canvas>

<div id="mobile">
<div style="display:flex;gap:10px;">
<div class="btn" id="left">◀</div>
<div class="btn" id="right">▶</div>
</div>

<div style="display:flex;gap:10px;">
<div class="btn" id="jump">▲</div>
<div class="btn" id="attack">⚔</div>
</div>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let gravity=0.8;

let worldWidth=3000;

let cameraX=0;

let player={
x:100,
y:200,
w:50,
h:70,
vx:0,
vy:0,
speed:6,
jumpPower:-15,
onGround:false,
doubleJump:true,
life:100,
coins:0,
attacking:false
};

let keys={};

let npc={
x:800,
y:canvas.height-170,
talked:false
};

let boss={
x:2500,
y:canvas.height-220,
w:120,
h:120,
life:100,
alive:true
};

let enemies=[];

for(let i=0;i<12;i++){
enemies.push({
x:500+i*180,
y:canvas.height-140,
w:40,
h:40,
life:20
});
}

let coins=[];

for(let i=0;i<30;i++){
coins.push({
x:250+i*90,
y:canvas.height-220
});
}

let platforms=[
{x:0,y:canvas.height-70,w:3000,h:70},
{x:500,y:canvas.height-180,w:150,h:20},
{x:1000,y:canvas.height-250,w:150,h:20},
{x:1400,y:canvas.height-200,w:150,h:20},
{x:1800,y:canvas.height-300,w:150,h:20}
];

document.addEventListener("keydown",e=>{
keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
});

function saveGame(){
localStorage.setItem("newtonix_save",
JSON.stringify({
coins:player.coins,
life:player.life
}));
}

function loadGame(){

let data=localStorage.getItem("newtonix_save");

if(data){

data=JSON.parse(data);

player.coins=data.coins;
player.life=data.life;
}
}

loadGame();

function attack(){
player.attacking=true;

setTimeout(()=>{
player.attacking=false;
},200);
}

function update(){

player.vx=0;

if(keys["ArrowLeft"]||mobile.left)
player.vx=-player.speed;

if(keys["ArrowRight"]||mobile.right)
player.vx=player.speed;

player.x+=player.vx;

player.vy+=gravity;
player.y+=player.vy;

player.onGround=false;

for(let p of platforms){

if(
player.x+player.w>p.x &&
player.x<p.x+p.w &&
player.y+player.h>p.y &&
player.y+player.h<p.y+30 &&
player.vy>=0
){
player.y=p.y-player.h;
player.vy=0;
player.onGround=true;
player.doubleJump=true;
}
}

if(player.y>canvas.height){
player.life=0;
}

cameraX=player.x-canvas.width/3;

for(let e of enemies){

if(e.life<=0) continue;

if(Math.abs(e.x-player.x)<250){

if(e.x<player.x) e.x+=1;
else e.x-=1;
}

if(
player.x<e.x+e.w &&
player.x+player.w>e.x &&
player.y<e.y+e.h &&
player.y+player.h>e.y
){
player.life-=0.1;
}

if(player.attacking){

if(
Math.abs(player.x-e.x)<80
){
e.life=0;
}
}
}

for(let i=coins.length-1;i>=0;i--){

let c=coins[i];

if(
player.x<c.x+20 &&
player.x+player.w>c.x &&
player.y<c.y+20 &&
player.y+player.h>c.y
){
coins.splice(i,1);
player.coins++;
saveGame();
}
}

if(
!npc.talked &&
Math.abs(player.x-npc.x)<100
){
npc.talked=true;

let box=document.getElementById("npcBox");

box.style.display="block";

box.innerHTML=
"<b>Professor Vector:</b><br>" +
"Um corpo tende a permanecer em repouso ou movimento uniforme até que uma força externa atue sobre ele.";

setTimeout(()=>{
box.style.display="none";
},7000);
}

if(
boss.alive &&
Math.abs(player.x-boss.x)<100 &&
player.attacking
){
boss.life-=1;
}

if(boss.life<=0){
boss.alive=false;

setTimeout(()=>{
document.getElementById("quiz").style.display="block";
},1000);
}

document.getElementById("vida").innerText=
Math.floor(player.life);

document.getElementById("coins").innerText=
player.coins;
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<50;i++){

ctx.fillStyle="rgba(255,255,255,.4)";
ctx.fillRect((i*200-cameraX*0.2)%4000,80,2,2);
}

for(let p of platforms){

ctx.fillStyle="#654321";
ctx.fillRect(
p.x-cameraX,
p.y,
p.w,
p.h
);
}

ctx.fillStyle="gold";

for(let c of coins){

ctx.beginPath();

ctx.arc(
c.x-cameraX,
c.y,
10,
0,
Math.PI*2
);

ctx.fill();
}

ctx.fillStyle="blue";

ctx.fillRect(
player.x-cameraX,
player.y,
player.w,
player.h
);

if(player.attacking){

ctx.fillStyle="cyan";

ctx.fillRect(
player.x-cameraX+50,
player.y+20,
30,
15
);
}

ctx.fillStyle="green";

ctx.fillRect(
npc.x-cameraX,
npc.y,
50,
80
);

for(let e of enemies){

if(e.life<=0) continue;

ctx.fillStyle="red";

ctx.fillRect(
e.x-cameraX,
e.y,
e.w,
e.h
);
}

if(boss.alive){

ctx.fillStyle="purple";

ctx.fillRect(
boss.x-cameraX,
boss.y,
boss.w,
boss.h
);

ctx.fillStyle="red";

ctx.fillRect(
boss.x-cameraX,
boss.y-20,
boss.life,
10
);
}
}

function gameLoop(){

update();
draw();

requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown",e=>{

if(e.code==="Space"){

if(player.onGround){

player.vy=player.jumpPower;

}else if(player.doubleJump){

player.vy=player.jumpPower;

player.doubleJump=false;
}
}

if(e.key==="x"){
attack();
}
});

const mobile={
left:false,
right:false
};

function bind(id,key){

const btn=document.getElementById(id);

btn.addEventListener("touchstart",e=>{
e.preventDefault();
mobile[key]=true;
});

btn.addEventListener("touchend",e=>{
e.preventDefault();
mobile[key]=false;
});
}

bind("left","left");
bind("right","right");

document.getElementById("jump")
.addEventListener("touchstart",()=>{

if(player.onGround){

player.vy=player.jumpPower;

}else if(player.doubleJump){

player.vy=player.jumpPower;

player.doubleJump=false;
}
});

document.getElementById("attack")
.addEventListener("touchstart",attack);

function answer(correct){

if(correct){

alert(
"Correto! A Primeira Lei de Newton é a Lei da Inércia."
);

}else{

alert(
"Errado! A resposta correta é Lei da Inércia."
);
}

document.getElementById("quiz").style.display="none";
}

gameLoop();

</script>

</body>
</html>
